name: Web backend release dependencies

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  release-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every test runs under a hard per-test limit, so one slow or stuck test
          # fails by name instead of the whole job being cancelled. The XRF
          # extraction tests run full detector calibrations and get their own job.
          - suite: main
            select: not xrf_slow
            per_test_seconds: 120
            minutes: 25
          - suite: xrf
            select: xrf_slow
            per_test_seconds: 180
            minutes: 40
    name: release-backend (${{ matrix.suite }})
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployment and watcher regressions
        shell: bash
        run: |
          bash tests/test_deploy_xraylarch_web.sh
          bash tests/test_deploy_release_dependencies.sh
          bash tests/test_watcher.sh
          bash tests/test_watcher_bootstrap.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the release backend and verify dependencies in a clean environment
        shell: bash
        env:
          SELECT: ${{ matrix.select }}
          PER_TEST_SECONDS: ${{ matrix.per_test_seconds }}
        run: |
          set -Eeuo pipefail
          python -m venv "$GITHUB_WORKSPACE/backend/.venv"
          XRAYLARCH_WEB_TEST_MODE=1 source scripts/deploy-xraylarch-web.sh
          REQUESTED_SHA="$(git rev-parse HEAD)"
          validate_sha "$REQUESTED_SHA"
          SAFE_PATH="$(dirname "$(command -v python)"):/usr/local/bin:/usr/bin:/bin"
          DATA_ROOT="$RUNNER_TEMP/xraylarch-release-data"
          CANDIDATE_DATA="$RUNNER_TEMP/xraylarch-release-candidate"
          CLEAN_HOME="$CANDIDATE_DATA/home"
          mkdir -p "$DATA_ROOT" "$CLEAN_HOME" "$CANDIDATE_DATA/runtime/pycache"
          install_release_backend "$GITHUB_WORKSPACE"
          verify_release_backend "$GITHUB_WORKSPACE"
          # The per-test limit is a test-runner plugin only, added after the
          # release environment has been verified, so it never reaches a release.
          "$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pip install --quiet pytest-timeout==2.3.1
          cd "$GITHUB_WORKSPACE/backend"
          run_clean "$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest -p no:cacheprovider -q \
            -m "$SELECT" --timeout="$PER_TEST_SECONDS" --durations=25 \
            --basetemp "$RUNNER_TEMP/xraylarch-full-backend-tests" tests
